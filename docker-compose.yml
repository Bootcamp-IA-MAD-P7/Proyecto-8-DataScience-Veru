services:
  db:
    image: postgres:16-alpine
    container_name: stroke_db
    environment:
      POSTGRES_USER: stroke
      POSTGRES_PASSWORD: stroke
      POSTGRES_DB: stroke_predictions
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stroke -d stroke_predictions"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: dockerfile
    container_name: stroke_api
    environment:
      DATABASE_URL: postgresql://stroke:stroke@db:5432/stroke_predictions
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: